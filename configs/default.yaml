# AutoMLE default configuration.
# CLI flags override these values. See program.md for full documentation.

# --- Required experiment inputs ---------------------------------------------
# Base model: HuggingFace model ID or absolute/relative path to a local checkpoint.
checkpoint: Qwen/Qwen3-1.7B

# User-provided data.py exposing load_train_dataset / load_eval_dataset.
data_file: examples/product_comparison/data.py

# User-provided evaluator.py exposing evaluate(adapter_dir, model_name, eval_data).
evaluator_file: examples/product_comparison/evaluator.py

# --- Task identity ----------------------------------------------------------
# Task key — used for the feature branch and tasks/<key>/ folder.
# Leave blank to auto-generate (task_<random>).
key:

# --- Auto-research loop controls --------------------------------------------
budget: 10          # max exploration runs before promotion phase
final_top_k: 3      # top-K configs re-run at full scale
target_accuracy:    # set e.g. 0.92 to stop exploration early (null = disabled)
